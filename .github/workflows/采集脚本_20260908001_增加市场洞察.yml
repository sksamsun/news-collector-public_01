name: News Collector Job Public
on:
  workflow_dispatch:
  schedule:
    # UTC时间 0点 = 北京时间早上8点，每天执行
    - cron: '0 0 * * *'
  push:
    branches: [ main ]

concurrency:
  group: collector-job
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 安装Chrome浏览器(Selenium使用)
        uses: browser-actions/setup-chrome@v1

      - name: Python 3.11环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tencent-cloud-tmt textrank4zh sumy xlsxwriter selenium webdriver-manager numpy

      - name: 运行采集脚本
        env:
          NEWS_OUTPUT_DIR: ${{ github.workspace }}/reports
          TENCENT_SECRET_ID_1: ${{ secrets.TENCENT_SECRET_ID_1 }}
          TENCENT_SECRET_KEY_1: ${{ secrets.TENCENT_SECRET_KEY_1 }}
          TENCENT_SECRET_ID_2: ${{ secrets.TENCENT_SECRET_ID_2 }}
          TENCENT_SECRET_KEY_2: ${{ secrets.TENCENT_SECRET_KEY_2 }}
          BAIDU_APP_ID: ${{ secrets.BAIDU_APP_ID }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python 采集脚本_20260908001_增加市场洞察.py

      - name: 上传生成报告制品
        uses: actions/upload-artifact@v4
        with:
          name: news-report-output
          path: ./reports/
          retention-days: 7
